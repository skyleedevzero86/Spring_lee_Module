<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS 발송</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row">
        <div class="col-12">
            <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
                <div class="container-fluid">
                    <span class="navbar-brand">📄 LMS 발송</span>
                    <div class="navbar-nav ms-auto">
                        <a class="nav-link" href="/">홈</a>
                        <a class="nav-link" href="/message">카카오 메시지</a>
                        <a class="nav-link" href="/email">이메일</a>
                        <a class="nav-link" href="/solapi/">SOLAPI</a>
                        <a class="nav-link" href="/logout">로그아웃</a>
                    </div>
                </div>
            </nav>
        </div>
    </div>

    <div class="row">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h5>📄 LMS 발송</h5>
                </div>
                <div class="card-body">
                    <form action="/solapi/send/lms" method="post">
                        <div class="mb-3">
                            <label for="to" class="form-label">수신번호 *</label>
                            <input type="tel" class="form-control" id="to" name="to"
                                   placeholder="01012345678" pattern="[0-9]{10,11}" required>
                            <div class="form-text">01012345678 형식으로 입력하세요</div>
                        </div>

                        <div class="mb-3">
                            <label for="subject" class="form-label">제목 *</label>
                            <input type="text" class="form-control" id="subject" name="subject"
                                   placeholder="LMS 제목을 입력하세요" required>
                        </div>

                        <div class="mb-3">
                            <label for="text" class="form-label">메시지 내용 *</label>
                            <textarea class="form-control" id="text" name="text" rows="8"
                                      placeholder="LMS는 2000자까지 입력할 수 있습니다." required></textarea>
                            <div class="form-text">
                                <span id="charCount">0</span>/2000자
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="scheduledDate" class="form-label">예약 발송 (선택사항)</label>
                            <input type="datetime-local" class="form-control" id="scheduledDate" name="scheduledDate">
                            <div class="form-text">예약하지 않으면 즉시 발송됩니다</div>
                        </div>

                        <button type="submit" class="btn btn-success">📄 LMS 발송</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <div class="card-header">
                    <h6>📋 LMS 가이드</h6>
                </div>
                <div class="card-body">
                    <h6>📄 LMS 특징</h6>
                    <ul class="small">
                        <li>최대 2000자까지 입력 가능</li>
                        <li>제목과 내용으로 구성</li>
                        <li>상세한 정보 전달에 적합</li>
                        <li>이미지 첨부 불가</li>
                    </ul>

                    <h6>📞 사용 사례</h6>
                    <ul class="small">
                        <li>공지사항</li>
                        <li>상세 안내</li>
                        <li>긴 메시지</li>
                        <li>공식 통보</li>
                    </ul>
                </div>
            </div>

            <div class="card mt-3">
                <div class="card-header">
                    <h6>💡 템플릿 예제</h6>
                </div>
                <div class="card-body">
                    <button class="btn btn-sm btn-outline-success mb-2" onclick="setTemplate('notice')">
                        공지사항
                    </button>
                    <button class="btn btn-sm btn-outline-success mb-2" onclick="setTemplate('event')">
                        이벤트 안내
                    </button>
                    <button class="btn btn-sm btn-outline-success mb-2" onclick="setTemplate('guide')">
                        이용 가이드
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const templates = {
        notice: {
            subject: "[공지] 서비스 점검 안내",
            text: "안녕하세요.\n\n서비스 점검으로 인해 아래 시간 동안 서비스 이용이 제한됩니다.\n\n점검 시간: 2024년 1월 15일 02:00 ~ 06:00\n\n점검 중에는 서비스 이용이 불가능하오니 양해 부탁드립니다.\n\n감사합니다."
        },
        event: {
            subject: "[이벤트] 신규 회원 혜택",
            text: "�� 신규 회원을 위한 특별 혜택을 준비했습니다!\n\n✅ 첫 구매 시 20% 할인\n✅ 무료 배송\n✅ 적립금 5,000원 지급\n\n이벤트 기간: 2024년 1월 1일 ~ 1월 31일\n\n지금 바로 확인해보세요!"
        },
        guide: {
            subject: "[가이드] 서비스 이용 방법",
            text: "서비스 이용 방법을 안내드립니다.\n\n1. 회원가입\n2. 로그인\n3. 원하는 서비스 선택\n4. 결제 및 이용\n\n자세한 내용은 고객센터(1588-0000)로 문의해주세요.\n\n운영시간: 평일 09:00 ~ 18:00"
        }
    };

    function setTemplate(type) {
        const template = templates[type];
        document.getElementById('subject').value = template.subject;
        document.getElementById('text').value = template.text;
        updateCharCount();
    }

    function updateCharCount() {
        const text = document.getElementById('text').value;
        const count = text.length;
        document.getElementById('charCount').textContent = count;

        if (count > 2000) {
            document.getElementById('charCount').style.color = 'red';
        } else {
            document.getElementById('charCount').style.color = 'black';
        }
    }

    document.getElementById('text').addEventListener('input', updateCharCount);
    updateCharCount();
</script>
</body>
</html>
