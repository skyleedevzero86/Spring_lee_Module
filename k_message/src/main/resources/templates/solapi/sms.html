<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS 발송</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row">
        <div class="col-12">
            <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
                <div class="container-fluid">
                    <span class="navbar-brand">📱 SMS 발송</span>
                    <div class="navbar-nav ms-auto">
                        <a class="nav-link" href="/">홈</a>
                        <a class="nav-link" href="/message">카카오 메시지</a>
                        <a class="nav-link" href="/email">이메일</a>
                        <a class="nav-link" href="/solapi/">SOLAPI</a>
                        <a class="nav-link" href="/logout">로그아웃</a>
                    </div>
                </div>
            </nav>
        </div>
    </div>

    <div class="row">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h5>📱 SMS 발송</h5>
                </div>
                <div class="card-body">
                    <form action="/solapi/send/sms" method="post">
                        <div class="mb-3">
                            <label for="to" class="form-label">수신번호 *</label>
                            <input type="tel" class="form-control" id="to" name="to"
                                   placeholder="01012345678" pattern="[0-9]{10,11}" required>
                            <div class="form-text">01012345678 형식으로 입력하세요</div>
                        </div>

                        <div class="mb-3">
                            <label for="text" class="form-label">메시지 내용 *</label>
                            <textarea class="form-control" id="text" name="text" rows="4"
                                      placeholder="SMS는 90자까지 입력할 수 있습니다." required></textarea>
                            <div class="form-text">
                                <span id="charCount">0</span>/90자
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="scheduledDate" class="form-label">예약 발송 (선택사항)</label>
                            <input type="datetime-local" class="form-control" id="scheduledDate" name="scheduledDate">
                            <div class="form-text">예약하지 않으면 즉시 발송됩니다</div>
                        </div>

                        <button type="submit" class="btn btn-primary">📱 SMS 발송</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <div class="card-header">
                    <h6>📋 SMS 가이드</h6>
                </div>
                <div class="card-body">
                    <h6>📱 SMS 특징</h6>
                    <ul class="small">
                        <li>최대 90자까지 입력 가능</li>
                        <li>간단한 알림에 적합</li>
                        <li>빠른 전송</li>
                        <li>모든 휴대폰에서 수신 가능</li>
                    </ul>

                    <h6>📞 사용 사례</h6>
                    <ul class="small">
                        <li>인증번호</li>
                        <li>간단한 알림</li>
                        <li>예약 확인</li>
                        <li>긴급 공지</li>
                    </ul>
                </div>
            </div>

            <div class="card mt-3">
                <div class="card-header">
                    <h6>💡 템플릿 예제</h6>
                </div>
                <div class="card-body">
                    <button class="btn btn-sm btn-outline-primary mb-2" onclick="setTemplate('auth')">
                        인증번호
                    </button>
                    <button class="btn btn-sm btn-outline-primary mb-2" onclick="setTemplate('notice')">
                        간단 알림
                    </button>
                    <button class="btn btn-sm btn-outline-primary mb-2" onclick="setTemplate('reservation')">
                        예약 확인
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const templates = {
        auth: {
            text: "[인증번호] 123456\n\n본인확인을 위해 위 번호를 입력해주세요."
        },
        notice: {
            text: "[알림] 서비스 점검으로 인해 일시적으로 이용이 제한됩니다."
        },
        reservation: {
            text: "[예약확인] 2024년 1월 15일 14:00 예약이 완료되었습니다."
        }
    };

    function setTemplate(type) {
        const template = templates[type];
        document.getElementById('text').value = template.text;
        updateCharCount();
    }

    function updateCharCount() {
        const text = document.getElementById('text').value;
        const count = text.length;
        document.getElementById('charCount').textContent = count;

        if (count > 90) {
            document.getElementById('charCount').style.color = 'red';
        } else {
            document.getElementById('charCount').style.color = 'black';
        }
    }

    document.getElementById('text').addEventListener('input', updateCharCount);
    updateCharCount();
</script>
</body>
</html>
