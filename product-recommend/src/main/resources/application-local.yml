spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5433}/${DATABASE_NAME:product_recommend}
    username: ${DATABASE_USERNAME:recommend}
    password: ${DATABASE_PASSWORD:recommend}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
      - org.springframework.ai.model.chat.memory.repository.jdbc.autoconfigure.JdbcChatMemoryRepositoryAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  ai:
    mcp:
      server:
        enabled: false
    model:
      chat: none
      embedding: none
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never

app:
  embedding:
    provider: hash
    model: hash-sha256-v1
    backfill-enabled: false
  vector:
    mode: memory
  chat:
    enabled: false
  outbox:
    enabled: true
    kafka-enabled: false
