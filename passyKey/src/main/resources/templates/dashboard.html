<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>대시보드 - PassyKey</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <header>
            <h1>PassyKey 대시보드</h1>
            <button id="logoutBtn" class="btn btn-secondary">로그아웃</button>
        </header>
        <main>
            <div class="dashboard-card">
                <h2>내 패스키</h2>
                <button id="addPasskeyBtn" class="btn btn-primary">새 패스키 추가</button>
                <div id="passkeyMessage" class="message"></div>
                <div id="credentialsList" class="credentials-list"></div>
            </div>
        </main>
    </div>
    <script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
