<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <meta name="description" content="PassyKey 회원가입">
    <title>회원가입 - PassyKey</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard-dynamic-subset.min.css" />
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <a href="#main-content" class="skip-link">본문으로 바로가기</a>

    <header class="header" role="banner">
        <div class="header__container">
            <div class="header__logo">
                <a href="/" aria-label="홈으로 이동">PassyKey</a>
            </div>
            <button class="header__mobile-toggle" aria-label="모바일 메뉴 토글" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main id="main-content" role="main">
        <section class="auth-page">
            <div class="auth-container">
                <div class="auth-header">
                    <h1>회원가입</h1>
                    <p>PassyKey 계정을 만들어보세요</p>
                </div>
                <div class="auth-card">
                    <form id="registerForm">
                        <div class="form-group">
                            <label for="username">사용자명</label>
                            <input
                                type="text"
                                id="username"
                                name="username"
                                required
                                minlength="3"
                                maxlength="50"
                            />
                            <span class="error-message" id="usernameError"></span>
                        </div>
                        <div class="form-group">
                            <label for="email">이메일</label>
                            <input type="email" id="email" name="email" required />
                            <span class="error-message" id="emailError"></span>
                        </div>
                        <div class="form-group">
                            <label for="displayName">표시 이름</label>
                            <input
                                type="text"
                                id="displayName"
                                name="displayName"
                                required
                                maxlength="100"
                            />
                        </div>
                        <div class="form-group">
                            <label for="password">비밀번호</label>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                required
                                minlength="6"
                            />
                        </div>
                        <button type="submit" class="btn btn--primary" style="width: 100%;">회원가입</button>
                    </form>
                    <div id="registerMessage" class="message"></div>
                    <div class="divider">
                        <span>회원가입 후 패스키를 추가하세요</span>
                    </div>
                    <button
                        id="addPasskeyBtn"
                        class="btn btn-secondary"
                        style="display: none; width: 100%;"
                    >
                        패스키 추가
                    </button>
                    <div id="passkeyMessage" class="message"></div>
                    <div class="link-section">
                        <a href="/login">이미 계정이 있으신가요? 로그인</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer" role="contentinfo">
        <div class="footer__bottom">
            <div class="container">
                <div class="footer__content">
                    <p>© 2025 PassyKey. All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <script th:src="@{/js/register.js}"></script>
</body>
</html>
