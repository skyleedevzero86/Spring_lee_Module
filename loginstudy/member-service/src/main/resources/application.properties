spring.application.name=member-service
server.port=8083
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/loginstudy_member
spring.datasource.username=${DB_USERNAME:loginstudy}
spring.datasource.password=${DB_PASSWORD:loginstudy_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.pool-name=member-service-hikari
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER_URI:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.audiences=member-service

member.api.default-tenant-id=tenant-demo

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=3s
spring.data.redis.connect-timeout=3s
spring.data.redis.lettuce.cluster.refresh.adaptive=true
spring.data.redis.lettuce.cluster.refresh.period=30s
loginstudy.redis.cluster-nodes=${REDIS_CLUSTER_NODES:}
loginstudy.redis.nat-remap=${REDIS_NAT_REMAP:false}

member.rate-limit.per-minute=60

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.db.enabled=true
management.health.redis.enabled=true

logging.level.org.springframework.security=INFO

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.show-actuator=false
