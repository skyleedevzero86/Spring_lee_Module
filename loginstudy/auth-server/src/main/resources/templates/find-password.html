<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>LoginStudy 비밀번호 찾기</title>
    <link rel="stylesheet" th:href="@{/css/account-recovery.css}"/>
</head>
<body>
<div class="recovery-shell">
    <header class="page-header">
        <h1>아이디/비밀번호찾기</h1>
        <nav class="breadcrumb" aria-label="현재 위치">
            <span class="home-icon" aria-hidden="true"></span>
            <span>통합인증</span><span aria-hidden="true">›</span><strong>아이디/비밀번호찾기</strong>
        </nav>
    </header>

    <main class="recovery-content">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">LS</span>
            <strong>LoginStudy Identity</strong>
        </div>

        <nav class="recovery-tabs" aria-label="계정 찾기 메뉴">
            <a th:href="@{/account-recovery/id}">아이디 찾기</a>
            <a class="active" th:href="@{/account-recovery/password}" aria-current="page">비밀번호 찾기</a>
        </nav>

        <section class="method-card">
            <p class="method-label">방법1.</p>
            <h2>비밀번호를 분실하셨나요?</h2>
            <p>아래 입력란에 아이디, 이메일, 휴대전화번호를 입력해 주세요.</p>

            <form class="recovery-form"
                  th:action="@{/account-recovery/password/verify}"
                  th:object="${passwordVerificationForm}"
                  method="post"
                  novalidate>
                <div class="form-row">
                    <label for="username">아이디</label>
                    <div>
                        <input id="username"
                               type="text"
                               th:field="*{username}"
                               autocomplete="username"/>
                        <p class="field-error" th:errors="*{username}"></p>
                    </div>
                </div>
                <div class="form-row">
                    <label for="email">이메일</label>
                    <div>
                        <input id="email"
                               type="email"
                               th:field="*{email}"
                               autocomplete="email"
                               placeholder="name@example.com"/>
                        <p class="field-error" th:errors="*{email}"></p>
                    </div>
                </div>
                <div class="form-row">
                    <label for="phone">휴대전화</label>
                    <div>
                        <input id="phone"
                               type="tel"
                               th:field="*{phone}"
                               autocomplete="tel"
                               placeholder="입력 예) 010-1234-1234"/>
                        <p class="field-error" th:errors="*{phone}"></p>
                    </div>
                </div>

                <p class="form-error" th:if="${recoveryError}" th:text="${recoveryError}" role="alert"></p>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="find-button" type="submit">본인정보 확인</button>
            </form>
        </section>
    </main>
</div>
</body>
</html>
