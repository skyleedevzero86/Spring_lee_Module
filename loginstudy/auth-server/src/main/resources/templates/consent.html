<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Authorization Consent</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}"/>
</head>
<body>
<main class="panel">
    <h1>권한 동의</h1>
    <p class="subtitle">
        <span th:text="${principalName}">user</span> 님이
        <strong th:text="${clientId}">client</strong> 앱의 접근을 승인합니다.
    </p>

    <form method="post" th:action="@{/oauth2/authorize}">
        <input type="hidden" name="client_id" th:value="${clientId}"/>
        <input type="hidden" name="state" th:value="${state}"/>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <fieldset>
            <legend>요청 Scope</legend>
            <div th:each="scope : ${scopes}" class="scope-item">
                <label>
                    <input type="checkbox" name="scope" th:value="${scope}" checked="checked"/>
                    <span th:text="${scope}">scope</span>
                </label>
            </div>
        </fieldset>

        <div class="actions">
            <button type="submit" name="submit" value="continue">승인</button>
            <button type="submit" name="submit" value="cancel" class="secondary">거부</button>
        </div>
    </form>
</main>
</body>
</html>
