<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>LoginStudy 회원가입 - 정보 입력</title>
    <link rel="stylesheet" th:href="@{/css/register.css}"/>
</head>
<body>
<div class="register-shell">
    <header class="page-header">
        <h1>회원가입</h1>
        <nav class="breadcrumb" aria-label="현재 위치">
            <span class="home-icon" aria-hidden="true"></span>
            <span>통합인증</span><span aria-hidden="true">›</span><strong>회원가입</strong>
        </nav>
    </header>

    <ol class="step-list" aria-label="회원가입 진행 단계">
        <li><span>01</span><strong>회원선택</strong></li>
        <li><span>02</span><strong>약관동의/본인인증</strong></li>
        <li class="active" aria-current="step"><span>✓</span><strong>정보입력</strong></li>
        <li><span>04</span><strong>가입완료</strong></li>
    </ol>

    <main>
        <section class="intro-section">
            <h2>회원정보 입력</h2>
            <p>로그인과 서비스 이용에 필요한 정보를 정확하게 입력해 주세요.</p>
        </section>

        <form class="details-form"
              th:action="@{/register}"
              th:object="${registrationForm}"
              method="post"
              novalidate>
            <div class="global-error"
                 th:if="${#fields.hasGlobalErrors()}"
                 th:each="error : ${#fields.globalErrors()}"
                 th:text="${error}"
                 role="alert"></div>

            <div class="form-row">
                <label for="memberType">회원 구분 <em>필수</em></label>
                <div>
                    <select id="memberType" th:field="*{memberType}">
                        <option value="">선택해 주세요</option>
                        <option value="PERSONAL">개인회원</option>
                        <option value="BUSINESS">기업회원</option>
                    </select>
                    <p class="field-error" th:errors="*{memberType}"></p>
                </div>
            </div>

            <div class="form-row">
                <label for="username">아이디 <em>필수</em></label>
                <div>
                    <input id="username"
                           type="text"
                           th:field="*{username}"
                           autocomplete="username"
                           placeholder="영문 소문자, 숫자, 밑줄, 하이픈 4~50자"/>
                    <p class="field-error" th:errors="*{username}"></p>
                </div>
            </div>

            <div class="form-row">
                <label for="password">비밀번호 <em>필수</em></label>
                <div>
                    <input id="password"
                           type="password"
                           th:field="*{password}"
                           autocomplete="new-password"
                           placeholder="영문, 숫자, 특수문자를 포함한 10자 이상"/>
                    <p class="field-error" th:errors="*{password}"></p>
                </div>
            </div>

            <div class="form-row">
                <label for="passwordConfirm">비밀번호 확인 <em>필수</em></label>
                <div>
                    <input id="passwordConfirm"
                           type="password"
                           th:field="*{passwordConfirm}"
                           autocomplete="new-password"/>
                    <p class="field-error" th:errors="*{passwordConfirm}"></p>
                </div>
            </div>

            <div class="form-row">
                <label for="displayName">이름 <em>필수</em></label>
                <div>
                    <input id="displayName"
                           type="text"
                           th:field="*{displayName}"
                           autocomplete="name"/>
                    <p class="field-error" th:errors="*{displayName}"></p>
                </div>
            </div>

            <div class="form-row">
                <label for="email">이메일 <em>필수</em></label>
                <div>
                    <input id="email"
                           type="email"
                           th:field="*{email}"
                           autocomplete="email"
                           placeholder="name@example.com"/>
                    <p class="field-error" th:errors="*{email}"></p>
                </div>
            </div>

            <div class="form-row">
                <label for="phone">휴대전화번호 <em>필수</em></label>
                <div>
                    <input id="phone"
                           type="tel"
                           th:field="*{phone}"
                           autocomplete="tel"
                           placeholder="010-0000-0000"/>
                    <p class="field-error" th:errors="*{phone}"></p>
                </div>
            </div>

            <input type="hidden" name="termsAccepted" value="true"/>
            <input type="hidden" name="privacyAccepted" value="true"/>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-actions">
                <a class="button secondary" th:href="@{/register}">이전단계</a>
                <button class="button primary" type="submit">가입하기</button>
            </div>
        </form>
    </main>
</div>
</body>
</html>
