<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>LoginStudy 새 비밀번호 설정</title>
    <link rel="stylesheet" th:href="@{/css/account-recovery.css}"/>
</head>
<body>
<div class="recovery-shell">
    <header class="page-header">
        <h1>새 비밀번호 설정</h1>
        <nav class="breadcrumb" aria-label="현재 위치">
            <span class="home-icon" aria-hidden="true"></span>
            <span>통합인증</span><span aria-hidden="true">›</span><strong>비밀번호 재설정</strong>
        </nav>
    </header>

    <main class="recovery-content">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">LS</span>
            <strong>LoginStudy Identity</strong>
        </div>

        <section class="method-card reset-card">
            <p class="method-label">본인정보 확인 완료</p>
            <h2>새로운 비밀번호를 입력해 주세요.</h2>
            <p>영문, 숫자, 특수문자를 포함하여 10자 이상 입력해야 합니다.</p>

            <form class="recovery-form"
                  th:action="@{/account-recovery/password/reset}"
                  th:object="${passwordResetForm}"
                  method="post"
                  novalidate>
                <div class="form-row">
                    <label for="password">새 비밀번호</label>
                    <div>
                        <input id="password"
                               type="password"
                               th:field="*{password}"
                               autocomplete="new-password"/>
                        <p class="field-error" th:errors="*{password}"></p>
                    </div>
                </div>
                <div class="form-row">
                    <label for="passwordConfirm">비밀번호 확인</label>
                    <div>
                        <input id="passwordConfirm"
                               type="password"
                               th:field="*{passwordConfirm}"
                               autocomplete="new-password"/>
                        <p class="field-error" th:errors="*{passwordConfirm}"></p>
                    </div>
                </div>

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="find-button" type="submit">비밀번호 변경</button>
            </form>
        </section>
    </main>
</div>
</body>
</html>
