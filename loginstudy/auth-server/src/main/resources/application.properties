spring.application.name=auth-server
server.port=9000
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/loginstudy_auth
spring.datasource.username=${DB_USERNAME:loginstudy}
spring.datasource.password=${DB_PASSWORD:loginstudy_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.pool-name=auth-server-hikari
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.security.oauth2.authorizationserver.issuer=http://localhost:9000

auth.rsa.private-key-location=${AUTH_RSA_PRIVATE_KEY:file:keys/private.pem}
auth.rsa.public-key-location=${AUTH_RSA_PUBLIC_KEY:file:keys/public.pem}
auth.rsa.key-id=${AUTH_RSA_KEY_ID:loginstudy-auth-key-1}

auth.bootstrap.tenant-id=tenant-demo

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=3s
spring.data.redis.connect-timeout=3s
spring.data.redis.lettuce.cluster.refresh.adaptive=true
spring.data.redis.lettuce.cluster.refresh.period=30s
loginstudy.redis.cluster-nodes=${REDIS_CLUSTER_NODES:}
loginstudy.redis.nat-remap=${REDIS_NAT_REMAP:false}

spring.session.timeout=30m
spring.session.redis.namespace={loginstudy}:auth
spring.session.redis.configure-action=none

server.servlet.session.cookie.name=AUTHSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

auth.login.max-failures=5
auth.login.failure-window=15m
auth.login.lock-duration=15m

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.redis.enabled=true

logging.level.org.springframework.security=INFO
