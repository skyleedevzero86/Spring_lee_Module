spring.application.name=auth-server
server.port=9000
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/loginstudy_auth
spring.datasource.username=${DB_USERNAME:loginstudy}
spring.datasource.password=${DB_PASSWORD:loginstudy_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.pool-name=auth-server-hikari
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.security.oauth2.authorizationserver.issuer=http://localhost:9000

auth.rsa.private-key-location=${AUTH_RSA_PRIVATE_KEY:file:auth-server/keys/private.pem}
auth.rsa.public-key-location=${AUTH_RSA_PUBLIC_KEY:file:auth-server/keys/public.pem}
auth.rsa.key-id=${AUTH_RSA_KEY_ID:loginstudy-auth-key-1}

auth.bootstrap.tenant-id=tenant-demo

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=3s
spring.data.redis.connect-timeout=3s
spring.data.redis.lettuce.cluster.refresh.adaptive=true
spring.data.redis.lettuce.cluster.refresh.period=30s
loginstudy.redis.cluster-enabled=${REDIS_CLUSTER_ENABLED:true}
loginstudy.redis.cluster-nodes=${REDIS_CLUSTER_NODES:localhost:7001,localhost:7002,localhost:7003,localhost:7004,localhost:7005,localhost:7006}
loginstudy.redis.nat-remap=${REDIS_NAT_REMAP:true}

spring.session.timeout=30m
spring.session.data.redis.namespace={loginstudy}:auth
spring.session.data.redis.configure-action=none

server.servlet.session.cookie.name=AUTHSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

auth.login.max-failures=5
auth.login.failure-window=15m
auth.login.lock-duration=15m

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.prometheus.access=unrestricted
management.prometheus.metrics.export.enabled=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
management.health.db.enabled=true
management.health.redis.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

logging.level.org.springframework.security=INFO

springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.show-actuator=false
logging.level.org.springdoc.core.events.SpringDocAppInitializer=ERROR
