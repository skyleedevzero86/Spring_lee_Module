spring.application.name=user-portal
server.port=8081
server.address=${SERVER_ADDRESS:127.0.0.1}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.security.oauth2.client.registration.user-portal.provider=loginstudy
spring.security.oauth2.client.registration.user-portal.client-id=user-portal
spring.security.oauth2.client.registration.user-portal.client-secret=${USER_PORTAL_CLIENT_SECRET:user-portal-secret}
spring.security.oauth2.client.registration.user-portal.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.user-portal.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.user-portal.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.user-portal.scope=openid,profile,email,member.read,member.write
spring.security.oauth2.client.registration.user-portal.client-name=User Portal

loginstudy.auth.issuer-uri=${AUTH_ISSUER_URI:http://localhost:9000}
loginstudy.auth.backchannel-uri=${AUTH_BACKCHANNEL_URI:${loginstudy.auth.issuer-uri}}
loginstudy.portal.admin-login-url=${ADMIN_PORTAL_LOGIN_URL:http://localhost:8082/oauth2/authorization/admin-portal?remember=true}
spring.security.oauth2.client.provider.loginstudy.issuer-uri=${loginstudy.auth.issuer-uri}
spring.security.oauth2.client.provider.loginstudy.authorization-uri=${loginstudy.auth.issuer-uri}/oauth2/authorize
spring.security.oauth2.client.provider.loginstudy.token-uri=${loginstudy.auth.backchannel-uri}/oauth2/token
spring.security.oauth2.client.provider.loginstudy.jwk-set-uri=${loginstudy.auth.backchannel-uri}/oauth2/jwks
spring.security.oauth2.client.provider.loginstudy.user-info-uri=${loginstudy.auth.backchannel-uri}/userinfo
spring.security.oauth2.client.provider.loginstudy.user-name-attribute=sub

member.api.base-url=${MEMBER_API_BASE_URL:http://localhost:8083}
member.api.connect-timeout=3s
member.api.read-timeout=5s

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=3s
spring.data.redis.connect-timeout=3s
spring.data.redis.lettuce.cluster.refresh.adaptive=true
spring.data.redis.lettuce.cluster.refresh.period=30s
loginstudy.redis.cluster-enabled=${REDIS_CLUSTER_ENABLED:true}
loginstudy.redis.cluster-nodes=${REDIS_CLUSTER_NODES:localhost:7001,localhost:7002,localhost:7003,localhost:7004,localhost:7005,localhost:7006}
loginstudy.redis.nat-remap=${REDIS_NAT_REMAP:true}

spring.session.timeout=30m
spring.session.data.redis.namespace={loginstudy}:user-portal
spring.session.data.redis.configure-action=none

server.servlet.session.cookie.name=USERSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.prometheus.access=unrestricted
management.prometheus.metrics.export.enabled=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
management.health.redis.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

logging.level.org.springframework.security=INFO

springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.show-actuator=false
logging.level.org.springdoc.core.events.SpringDocAppInitializer=ERROR
