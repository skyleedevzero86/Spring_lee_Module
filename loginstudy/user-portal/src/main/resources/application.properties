spring.application.name=user-portal
server.port=8081
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.security.oauth2.client.registration.user-portal.provider=loginstudy
spring.security.oauth2.client.registration.user-portal.client-id=user-portal
spring.security.oauth2.client.registration.user-portal.client-secret=${USER_PORTAL_CLIENT_SECRET:user-portal-secret}
spring.security.oauth2.client.registration.user-portal.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.user-portal.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.user-portal.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.user-portal.scope=openid,profile,email,member.read,member.write
spring.security.oauth2.client.registration.user-portal.client-name=User Portal

spring.security.oauth2.client.provider.loginstudy.issuer-uri=${AUTH_ISSUER_URI:http://localhost:9000}

member.api.base-url=${MEMBER_API_BASE_URL:http://localhost:8083}
member.api.connect-timeout=3s
member.api.read-timeout=5s

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=3s
spring.data.redis.connect-timeout=3s
spring.data.redis.lettuce.cluster.refresh.adaptive=true
spring.data.redis.lettuce.cluster.refresh.period=30s
loginstudy.redis.cluster-nodes=${REDIS_CLUSTER_NODES:}
loginstudy.redis.nat-remap=${REDIS_NAT_REMAP:false}

spring.session.timeout=30m
spring.session.redis.namespace={loginstudy}:user-portal
spring.session.redis.configure-action=none

server.servlet.session.cookie.name=USERSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.prometheus.access=unrestricted
management.prometheus.metrics.export.enabled=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
management.health.redis.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

logging.level.org.springframework.security=INFO

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.show-actuator=false
