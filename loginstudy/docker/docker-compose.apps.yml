services:
  auth-server:
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MODULE: auth-server
    image: loginstudy/auth-server:local
    container_name: loginstudy-auth-server
    expose:
      - "9000"
    environment:
      SERVER_PORT: 9000
      SERVER_ADDRESS: 0.0.0.0
      SERVER_SERVLET_CONTEXT_PATH: /auth
      SERVER_SERVLET_SESSION_COOKIE_PATH: /auth
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: loginstudy
      DB_PASSWORD: loginstudy_dev
      REDIS_CLUSTER_NODES: redis-1:7001,redis-2:7002,redis-3:7003,redis-4:7004,redis-5:7005,redis-6:7006
      REDIS_NAT_REMAP: "false"
      AUTH_RSA_PRIVATE_KEY: file:/keys/private.pem
      AUTH_RSA_PUBLIC_KEY: file:/keys/public.pem
      SPRING_SECURITY_OAUTH2_AUTHORIZATIONSERVER_ISSUER: http://localhost:8080/auth
    volumes:
      - ../auth-server/keys:/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis-cluster-init:
        condition: service_completed_successfully
    networks:
      - loginstudy-net

  member-service:
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MODULE: member-service
    image: loginstudy/member-service:local
    container_name: loginstudy-member-service
    expose:
      - "8083"
    environment:
      SERVER_PORT: 8083
      SERVER_ADDRESS: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: loginstudy
      DB_PASSWORD: loginstudy_dev
      AUTH_ISSUER_URI: http://localhost:8080/auth
      AUTH_JWK_SET_URI: http://auth-server:9000/auth/oauth2/jwks
      REDIS_CLUSTER_NODES: redis-1:7001,redis-2:7002,redis-3:7003,redis-4:7004,redis-5:7005,redis-6:7006
      REDIS_NAT_REMAP: "false"
    depends_on:
      postgres:
        condition: service_healthy
      auth-server:
        condition: service_started
    networks:
      - loginstudy-net

  user-portal:
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MODULE: user-portal
    image: loginstudy/user-portal:local
    container_name: loginstudy-user-portal
    expose:
      - "8081"
    environment:
      SERVER_PORT: 8081
      SERVER_ADDRESS: 0.0.0.0
      SERVER_SERVLET_CONTEXT_PATH: /user
      SERVER_SERVLET_SESSION_COOKIE_PATH: /user
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      AUTH_ISSUER_URI: http://localhost:8080/auth
      AUTH_BACKCHANNEL_URI: http://auth-server:9000/auth
      MEMBER_API_BASE_URL: http://member-service:8083
      ADMIN_PORTAL_LOGIN_URL: http://localhost:8080/admin/oauth2/authorization/admin-portal?remember=true
      REDIS_CLUSTER_NODES: redis-1:7001,redis-2:7002,redis-3:7003,redis-4:7004,redis-5:7005,redis-6:7006
      REDIS_NAT_REMAP: "false"
    depends_on:
      - auth-server
      - member-service
    networks:
      - loginstudy-net

  admin-portal:
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MODULE: admin-portal
    image: loginstudy/admin-portal:local
    container_name: loginstudy-admin-portal
    expose:
      - "8082"
    environment:
      SERVER_PORT: 8082
      SERVER_ADDRESS: 0.0.0.0
      SERVER_SERVLET_CONTEXT_PATH: /admin
      SERVER_SERVLET_SESSION_COOKIE_PATH: /admin
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      AUTH_ISSUER_URI: http://localhost:8080/auth
      AUTH_BACKCHANNEL_URI: http://auth-server:9000/auth
      MEMBER_API_BASE_URL: http://member-service:8083
      REDIS_CLUSTER_NODES: redis-1:7001,redis-2:7002,redis-3:7003,redis-4:7004,redis-5:7005,redis-6:7006
      REDIS_NAT_REMAP: "false"
    depends_on:
      - auth-server
      - member-service
    networks:
      - loginstudy-net

  gateway:
    profiles: ["apps"]
    image: nginx:1.27-alpine
    container_name: loginstudy-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-server
      - user-portal
      - admin-portal
    restart: unless-stopped
    networks:
      - loginstudy-net
