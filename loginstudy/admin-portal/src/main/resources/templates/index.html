<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Admin Portal</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}"/>
</head>
<body>
<main class="panel">
    <p class="eyebrow">LoginStudy Identity</p>
    <h1>관리자 로그인</h1>
    <p class="subtitle" th:unless="${param.loginFailed}">관리자 로그인 페이지로 이동하고 있습니다.</p>

    <p class="bad" th:if="${param.loginFailed}">로그인에 실패했습니다. 아래 버튼으로 처음부터 다시 시도하세요. (콜백 URL을 새로고침하지 마세요)</p>

    <a class="button"
       th:href="@{/oauth2/authorization/admin-portal}"
       th:text="${param.loginFailed} ? '다시 로그인' : '관리자 로그인 페이지로 이동'">
        관리자 로그인 페이지로 이동
    </a>

    <script th:unless="${param.loginFailed}" th:inline="javascript">
        window.location.replace(/*[[@{/oauth2/authorization/admin-portal}]]*/ "/oauth2/authorization/admin-portal");
    </script>
</main>
</body>
</html>
