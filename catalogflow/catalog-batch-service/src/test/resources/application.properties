app.batch.scheduler-enabled=false
app.batch.email-provider=fake
app.batch.chunk-size=10
app.batch.csv-skip-limit=50
app.batch.csv-retry-limit=2
app.batch.temp-image-retention-days=7
app.batch.cache-warmup-limit=20
app.batch.report-mail-to=test@catalogflow.local

spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false
spring.flyway.enabled=true
spring.flyway.table=flyway_schema_history_batch
spring.main.allow-bean-definition-overriding=true

app.security.enabled=false
