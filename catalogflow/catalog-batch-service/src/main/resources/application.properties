spring.application.name=catalog-batch-service
server.port=8084
app.service-name=catalog-batch-service

spring.datasource.url=jdbc:postgresql://localhost:5432/catalogflow
spring.datasource.username=catalogflow
spring.datasource.password=catalogflow
spring.datasource.driver-class-name=org.postgresql.Driver

spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

spring.flyway.enabled=true
spring.flyway.table=flyway_schema_history_batch
spring.flyway.locations=classpath:db/migration

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.batch.chunk-size=100
app.batch.csv-skip-limit=100
app.batch.csv-retry-limit=3
app.batch.temp-image-retention-days=7
app.batch.cache-warmup-limit=50
app.batch.report-mail-to=ops@catalogflow.local
app.batch.scheduler-enabled=true
app.batch.email-provider=fake

app.batch.cron.csv-import=-
app.batch.cron.read-model-rebuild=0 30 2 * * *
app.batch.cron.cache-warmup=0 0 3 * * *
app.batch.cron.ai-retry=0 15 * * * *
app.batch.cron.temp-image-cleanup=0 0 4 * * *
app.batch.cron.daily-report=0 0 8 * * *
