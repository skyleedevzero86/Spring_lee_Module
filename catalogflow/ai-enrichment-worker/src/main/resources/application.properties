spring.application.name=ai-enrichment-worker
spring.main.web-application-type=none
app.service-name=ai-enrichment-worker

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

app.messaging.exchange-events=catalog.events
app.messaging.exchange-commands=catalog.commands
app.messaging.exchange-dead-letter=catalog.dlx
app.messaging.queue-ai-enrichment-requests=ai-worker.enrichment-requests
app.messaging.queue-dead-letter=catalog.dead-letter
app.messaging.routing-key-prefix=catalog.product
app.messaging.consumer-prefetch=10
app.messaging.retry-max-attempts=3
app.messaging.retry-initial-delay-ms=3000
app.messaging.retry-multiplier=2.0
app.messaging.publisher-confirm-timeout-ms=5000
app.messaging.consumer-enabled=true

app.ai.provider=stub
app.ai.fallback-enabled=false
app.ai.model-name=stub-enrichment-v1
app.ai.prompt-version=stub-prompt-v1
app.ai.ollama.base-url=http://localhost:11434
app.ai.ollama.model=llama3.2
app.ai.ollama.temperature=0.2
app.ai.gemini.api-key=
app.ai.gemini.model=gemini-2.0-flash
app.ai.gemini.temperature=0.2

management.metrics.tags.application=${spring.application.name}
