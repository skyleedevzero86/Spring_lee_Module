spring.application.name=catalog-query-service
server.port=8082
app.service-name=catalog-query-service

spring.data.mongodb.uri=mongodb://localhost:27017/catalogflow_query
spring.data.mongodb.uuid-representation=standard

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.default-requeue-rejected=false

app.messaging.exchange-events=catalog.events
app.messaging.exchange-commands=catalog.commands
app.messaging.exchange-dead-letter=catalog.dlx
app.messaging.queue-query-product-events=catalog-query.product-events
app.messaging.queue-query-product-events-retry=catalog-query.product-events.retry
app.messaging.queue-ai-enrichment-requests=ai-worker.enrichment-requests
app.messaging.queue-enrichment-results=catalog-command.enrichment-results
app.messaging.queue-batch-retry=catalog-batch.retry
app.messaging.queue-dead-letter=catalog.dead-letter
app.messaging.routing-key-prefix=catalog.product
app.messaging.consumer-prefetch=10
app.messaging.retry-max-attempts=3
app.messaging.retry-initial-delay-ms=3000
app.messaging.retry-multiplier=2.0
app.messaging.publisher-confirm-timeout-ms=5000
app.messaging.consumer-enabled=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

app.cache.enabled=true
app.cache.product-ttl-seconds=300
app.cache.category-ttl-seconds=120
app.cache.popular-ttl-seconds=60
app.cache.null-ttl-seconds=60
