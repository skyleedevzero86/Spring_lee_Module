spring.application.name=oidc-demo-test
server.port=0

spring.datasource.url=jdbc:h2:mem:oidc;MODE=Oracle;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:/schema.sql

mybatis.mapper-locations=classpath:/mapper/*.xml
mybatis.type-aliases-package=com.sleekydz86.oidstudy.oidc.domain.user,com.sleekydz86.oidstudy.oidc.domain.notification
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.jdbc-type-for-null=NULL

spring.security.oauth2.client.registration.naver.provider=naver
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.registration.naver.client-id=test-client
spring.security.oauth2.client.registration.naver.client-secret=test-secret
spring.security.oauth2.client.registration.naver.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.naver.scope=openid
spring.security.oauth2.client.provider.naver.issuer-uri=https://nid.naver.com
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2/token
spring.security.oauth2.client.provider.naver.jwk-set-uri=https://nid.naver.com/oauth2/jwks
spring.security.oauth2.client.provider.naver.user-name-attribute=sub

app.security.bootstrap-admin-email=admin@example.com