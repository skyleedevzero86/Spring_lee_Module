<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>서버 오류</title>
    <style>
      body {
        margin: 0;
        font-family: "Pretendard", "Noto Sans KR", sans-serif;
        background: #f7f8fa;
        color: #1f2937;
      }
      .wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(680px, 100%);
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.5rem;
      }
      p {
        margin: 0;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="card">
        <h1>일시적인 서버 오류가 발생했습니다.</h1>
        <p>
          요청 처리 중 문제가 발생했습니다. 잠시 후 다시 시도해 주세요.
          문제가 계속되면 관리자에게 문의해 주세요.
        </p>
      </section>
    </main>
  </body>
</html>
