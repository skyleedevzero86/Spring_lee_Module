<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>실시간 대시보드 - Flink Event Analysis</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      .stat-card {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-radius: 15px;
        padding: 2rem;
        margin-bottom: 1rem;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }
      .stat-card h3 {
        font-size: 2.5rem;
        font-weight: bold;
        margin-bottom: 0.5rem;
      }
      .stat-card p {
        font-size: 1.1rem;
        opacity: 0.9;
      }
      .realtime-indicator {
        position: fixed;
        top: 20px;
        right: 20px;
        background: #28a745;
        color: white;
        padding: 10px 20px;
        border-radius: 25px;
        font-weight: bold;
        z-index: 1000;
      }
      .chart-container {
        background: white;
        border-radius: 15px;
        padding: 2rem;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        margin-bottom: 2rem;
      }
      .navbar-brand {
        font-weight: bold;
        font-size: 1.5rem;
      }
      .control-panel {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="/dashboard">
          <i class="fas fa-chart-line me-2"></i>Flink Event Analysis
        </a>
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="/dashboard">대시보드</a>
          <a class="nav-link" href="/products">상품</a>
          <a class="nav-link" href="/analytics">분석</a>
          <a class="nav-link" href="/admin">관리자</a>
        </div>
      </div>
    </nav>

    <div class="realtime-indicator" id="realtime-indicator">
      <i class="fas fa-circle me-2"></i>연결 중...
    </div>

    <div class="control-panel">
      <div class="btn-group-vertical" role="group">
        <button
          type="button"
          class="btn btn-sm btn-outline-primary"
          onclick="toggleUpdates()"
          id="toggleBtn"
        >
          <i class="fas fa-pause me-1"></i>일시정지
        </button>
        <button
          type="button"
          class="btn btn-sm btn-outline-secondary"
          onclick="refreshData()"
        >
          <i class="fas fa-sync me-1"></i>새로고침
        </button>
      </div>
    </div>

    <div class="container mt-4">
      <h1 class="mb-4">
        <i class="fas fa-tachometer-alt me-2"></i>실시간 대시보드
      </h1>

      <div class="row">
        <div class="col-md-3">
          <div class="stat-card">
            <h3 th:text="${totalUsers}">0</h3>
            <p><i class="fas fa-users me-2"></i>총 사용자</p>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stat-card">
            <h3 th:text="${totalEvents}">0</h3>
            <p><i class="fas fa-mouse-pointer me-2"></i>총 이벤트</p>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stat-card">
            <h3 th:text="${totalItems}">0</h3>
            <p><i class="fas fa-box me-2"></i>총 상품</p>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stat-card">
            <h3 th:text="${todayEvents}">0</h3>
            <p><i class="fas fa-calendar-day me-2"></i>오늘 이벤트</p>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <div class="chart-container">
            <h4><i class="fas fa-chart-bar me-2"></i>실시간 통계</h4>
            <div class="row">
              <div class="col-6">
                <div class="text-center">
                  <h5 class="text-primary" id="active-users">0</h5>
                  <p class="text-muted">활성 사용자</p>
                </div>
              </div>
              <div class="col-6">
                <div class="text-center">
                  <h5 class="text-success" id="events-per-second">0</h5>
                  <p class="text-muted">분당 이벤트</p>
                </div>
              </div>
            </div>
            <div class="text-center mt-3">
              <small class="text-muted"
                >마지막 업데이트: <span id="last-update">-</span></small
              >
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="chart-container">
            <h4><i class="fas fa-fire me-2"></i>인기 카테고리</h4>
            <canvas id="categoryChart" width="400" height="200"></canvas>
          </div>
        </div>
      </div>

      <div class="chart-container">
        <h4><i class="fas fa-history me-2"></i>최근 이벤트</h4>
        <div class="table-responsive">
          <table class="table table-striped">
            <thead>
              <tr>
                <th>사용자 ID</th>
                <th>상품 ID</th>
                <th>액션</th>
                <th>카테고리</th>
                <th>시간</th>
              </tr>
            </thead>
            <tbody id="recent-events"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      let socket;
      let categoryChart;
      let isUpdating = true;
      let reconnectAttempts = 0;
      const maxReconnectAttempts = 5;

      function connectWebSocket() {
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const wsUrl = `${protocol}//${window.location.host}/ws/dashboard`;

        socket = new WebSocket(wsUrl);

        socket.onopen = function (event) {
          console.log("WebSocket 연결됨");
          reconnectAttempts = 0;
          document.getElementById("realtime-indicator").innerHTML =
            '<i class="fas fa-circle me-2"></i>실시간 연결됨';
          document.getElementById("realtime-indicator").style.background =
            "#28a745";
        };

        socket.onmessage = function (event) {
          if (!isUpdating) return;

          try {
            const data = JSON.parse(event.data);
            console.log("실시간 데이터 수신:", data);

            if (data.error) {
              console.error("서버 오류:", data.error);
              return;
            }

            document.getElementById("active-users").textContent =
              data.activeUsers || 0;
            document.getElementById("events-per-second").textContent =
              data.eventsPerSecond || 0;
            document.getElementById("last-update").textContent = new Date(
              data.timestamp
            ).toLocaleTimeString();

            updateCategoryChart(data.topCategories);
            updateRecentEvents(data.recentEvents);
          } catch (e) {
            console.error("데이터 파싱 오류:", e);
          }
        };

        socket.onclose = function (event) {
          console.log("WebSocket 연결 종료");
          document.getElementById("realtime-indicator").innerHTML =
            '<i class="fas fa-circle me-2"></i>연결 끊김';
          document.getElementById("realtime-indicator").style.background =
            "#dc3545";

          // 자동 재연결 시도
          if (reconnectAttempts < maxReconnectAttempts) {
            reconnectAttempts++;
            console.log(
              `재연결 시도 ${reconnectAttempts}/${maxReconnectAttempts}`
            );
            setTimeout(connectWebSocket, 3000);
          }
        };

        socket.onerror = function (error) {
          console.error("WebSocket 오류:", error);
        };
      }

      function initCategoryChart() {
        const ctx = document.getElementById("categoryChart").getContext("2d");
        categoryChart = new Chart(ctx, {
          type: "doughnut",
          data: {
            labels: [],
            datasets: [
              {
                data: [],
                backgroundColor: [
                  "#FF6384",
                  "#36A2EB",
                  "#FFCE56",
                  "#4BC0C0",
                  "#9966FF",
                ],
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: "bottom",
              },
            },
          },
        });
      }

      function updateCategoryChart(categories) {
        if (!categoryChart || !categories) return;

        const labels = Object.keys(categories);
        const data = Object.values(categories);

        categoryChart.data.labels = labels;
        categoryChart.data.datasets[0].data = data;
        categoryChart.update("none");
      }

      function updateRecentEvents(events) {
        if (!events) return;

        const tbody = document.getElementById("recent-events");
        tbody.innerHTML = "";

        events.forEach((event) => {
          const row = document.createElement("tr");
          row.innerHTML = `
                    <td>${event.user_id}</td>
                    <td>${event.item_id}</td>
                    <td><span class="badge bg-primary">${
                      event.action_type
                    }</span></td>
                    <td>${event.category || "-"}</td>
                    <td>${new Date(event.timestamp).toLocaleString()}</td>
                `;
          tbody.appendChild(row);
        });
      }

      function toggleUpdates() {
        isUpdating = !isUpdating;
        const btn = document.getElementById("toggleBtn");

        if (isUpdating) {
          btn.innerHTML = '<i class="fas fa-pause me-1"></i>일시정지';
          btn.className = "btn btn-sm btn-outline-primary";
        } else {
          btn.innerHTML = '<i class="fas fa-play me-1"></i>재개';
          btn.className = "btn btn-sm btn-outline-success";
        }
      }

      function refreshData() {
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send("getStats");
        } else {
          connectWebSocket();
        }
      }

      window.addEventListener("beforeunload", function () {
        if (socket) {
          socket.close();
        }
      });

      document.addEventListener("DOMContentLoaded", function () {
        initCategoryChart();
        connectWebSocket();
      });
    </script>
  </body>
</html>
