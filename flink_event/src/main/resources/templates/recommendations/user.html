<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'추천 - ' + ${userId}">사용자 추천</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .user-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .segment-badge {
            font-size: 1.2rem;
            padding: 10px 20px;
            border-radius: 25px;
        }
        .segment-vip { background: linear-gradient(45deg, #ff6b6b, #ee5a24); }
        .segment-frequent { background: linear-gradient(45deg, #4ecdc4, #44a08d); }
        .segment-active { background: linear-gradient(45deg, #45b7d1, #96c93d); }
        .segment-engaged { background: linear-gradient(45deg, #f093fb, #f5576c); }
        .segment-new { background: linear-gradient(45deg, #4facfe, #00f2fe); }
        .recommendation-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            margin-bottom: 1rem;
        }
        .recommendation-card:hover {
            transform: translateY(-5px);
        }
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">
            <i class="fas fa-chart-line me-2"></i>Flink Event Analysis
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/dashboard">대시보드</a>
            <a class="nav-link" href="/products">상품</a>
            <a class="nav-link" href="/analytics">분석</a>
            <a class="nav-link" href="/admin">관리자</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="user-header">
        <div class="row align-items-center">
            <div class="col-md-8">
                <h1>
                    <i class="fas fa-user me-2"></i>
                    <span th:text="${userId}">사용자 ID</span>
                </h1>
                <p class="mb-0">개인화된 상품 추천</p>
            </div>
            <div class="col-md-4 text-end">
                    <span class="segment-badge"
                          th:classappend="'segment-' + ${userSegment?.toLowerCase()}"
                          th:text="${userSegment}">세그먼트</span>
            </div>
        </div>
    </div>

    <div class="row" th:if="${userStats != null and !userStats.isEmpty()}">
        <div class="col-md-3">
            <div class="stat-card">
                <h3 class="text-primary" th:text="${userStats.total_events}">0</h3>
                <p class="text-muted mb-0">총 이벤트</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <h3 class="text-success" th:text="${userStats.unique_items}">0</h3>
                <p class="text-muted mb-0">관심 상품</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <h3 class="text-warning" th:text="${userStats.purchases}">0</h3>
                <p class="text-muted mb-0">구매 횟수</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <h3 class="text-info" th:text="${userStats.avg_duration != null ? #numbers.formatDecimal(userStats.avg_duration, 0, 0) + '초' : 'N/A'}">0초</h3>
                <p class="text-muted mb-0">평균 체류시간</p>
            </div>
        </div>
    </div>

    <div class="mt-5">
        <h3 class="mb-4">
            <i class="fas fa-magic me-2"></i>추천 상품
            <span class="badge bg-primary ms-2" th:text="${recommendations.size()}">0</span>
        </h3>

        <div class="row" th:if="${recommendations != null and !recommendations.isEmpty()}">
            <div class="col-md-6 col-lg-4" th:each="item, iterStat : ${recommendations}">
                <div class="card recommendation-card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <h5 class="card-title mb-0" th:text="${item}">상품 ID</h5>
                            <span class="badge bg-primary">#<span th:text="${iterStat.index + 1}">1</span></span>
                        </div>
                        <p class="card-text text-muted">
                            <i class="fas fa-info-circle me-1"></i>
                            AI 추천 상품
                        </p>
                        <div class="d-grid gap-2">
                            <a th:href="@{/products/{id}(id=${item})}"
                               class="btn btn-outline-primary btn-sm">
                                <i class="fas fa-eye me-2"></i>상품 보기
                            </a>
                            <button class="btn btn-outline-success btn-sm"
                                    onclick="trackBehavior('${item}', 'CLICK')">
                                <i class="fas fa-mouse-pointer me-2"></i>클릭 추적
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center py-5" th:if="${recommendations == null or recommendations.isEmpty()}">
            <i class="fas fa-search fa-3x text-muted mb-3"></i>
            <h4 class="text-muted">추천 상품이 없습니다</h4>
            <p class="text-muted">더 많은 상품을 둘러보시면 맞춤 추천을 받을 수 있습니다.</p>
            <a href="/products" class="btn btn-primary">
                <i class="fas fa-shopping-bag me-2"></i>상품 둘러보기
            </a>
        </div>
    </div>

    <div class="text-center mt-4">
        <a href="/products" class="btn btn-secondary">
            <i class="fas fa-arrow-left me-2"></i>상품 목록으로 돌아가기
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function trackBehavior(itemId, actionType) {
        const event = {
            userId: '[[${userId}]]',
            itemId: itemId,
            actionType: actionType,
            category: '',
            rating: null,
            duration: null,
            deviceType: 'web',
            location: 'recommendation-page',
            platform: 'web'
        };

        fetch('/api/v1/behavior/track', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(event)
        })
            .then(response => response.text())
            .then(data => {
                console.log('행동 추적 성공:', data);
                const button = event.target;
                const originalText = button.innerHTML;
                button.innerHTML = '<i class="fas fa-check me-2"></i>추적됨';
                button.classList.remove('btn-outline-success');
                button.classList.add('btn-success');

                setTimeout(() => {
                    button.innerHTML = originalText;
                    button.classList.remove('btn-success');
                    button.classList.add('btn-outline-success');
                }, 2000);
            })
            .catch(error => {
                console.error('행동 추적 실패:', error);
            });
    }
</script>
</body>
</html>
