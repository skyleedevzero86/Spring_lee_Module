<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 목록 - Flink Event Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .product-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            margin-bottom: 2rem;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .product-card .card-body {
            padding: 1.5rem;
        }
        .popularity-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .rating-stars {
            color: #ffc107;
        }
        .filter-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">
            <i class="fas fa-chart-line me-2"></i>Flink Event Analysis
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/dashboard">대시보드</a>
            <a class="nav-link active" href="/products">상품</a>
            <a class="nav-link" href="/analytics">분석</a>
            <a class="nav-link" href="/admin">관리자</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1 class="mb-4">
        <i class="fas fa-box me-2"></i>상품 목록
    </h1>

    <div class="filter-section">
        <form method="get" action="/products">
            <div class="row align-items-end">
                <div class="col-md-4">
                    <label for="category" class="form-label">카테고리</label>
                    <select class="form-select" id="category" name="category">
                        <option value="">전체 카테고리</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat}"
                                th:text="${cat}"
                                th:selected="${cat == selectedCategory}">
                        </option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-search me-2"></i>필터
                    </button>
                </div>
                <div class="col-md-6 text-end">
                        <span class="text-muted">
                            총 <strong th:text="${products.size()}">0</strong>개 상품
                        </span>
                </div>
            </div>
        </form>
    </div>

    <div class="row" th:if="${products != null and !products.isEmpty()}">
        <div class="col-md-6 col-lg-4" th:each="product : ${products}">
            <div class="card product-card h-100">
                <div class="popularity-badge" th:if="${product.popularity_score != null}">
                    <i class="fas fa-fire me-1"></i>
                    <span th:text="${#numbers.formatDecimal(product.popularity_score, 1, 1)}">0.0</span>
                </div>
                <div class="card-body">
                    <h5 class="card-title" th:text="${product.item_id}">상품 ID</h5>
                    <p class="card-text">
                        <span class="badge bg-secondary" th:text="${product.category}">카테고리</span>
                    </p>
                    <div class="row text-center">
                        <div class="col-6">
                            <small class="text-muted">조회수</small>
                            <div class="fw-bold" th:text="${product.view_count}">0</div>
                        </div>
                        <div class="col-6">
                            <small class="text-muted">평점</small>
                            <div class="rating-stars">
                                <i class="fas fa-star" th:if="${product.avg_rating != null and product.avg_rating >= 1}"></i>
                                <i class="fas fa-star" th:if="${product.avg_rating != null and product.avg_rating >= 2}"></i>
                                <i class="fas fa-star" th:if="${product.avg_rating != null and product.avg_rating >= 3}"></i>
                                <i class="fas fa-star" th:if="${product.avg_rating != null and product.avg_rating >= 4}"></i>
                                <i class="fas fa-star" th:if="${product.avg_rating != null and product.avg_rating >= 5}"></i>
                                <span th:if="${product.avg_rating != null}"
                                      th:text="'(' + #numbers.formatDecimal(product.avg_rating, 1, 1) + ')'">(0.0)</span>
                            </div>
                        </div>
                    </div>
                    <div class="mt-3">
                        <a th:href="@{/products/{id}(id=${product.item_id})}"
                           class="btn btn-outline-primary btn-sm w-100">
                            <i class="fas fa-eye me-2"></i>상세보기
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center py-5" th:if="${products == null or products.isEmpty()}">
        <i class="fas fa-box-open fa-3x text-muted mb-3"></i>
        <h4 class="text-muted">상품이 없습니다</h4>
        <p class="text-muted">다른 카테고리를 선택해보세요.</p>
    </div>

    <nav aria-label="상품 페이지네이션" th:if="${products != null and !products.isEmpty()}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                <a class="page-link" th:href="@{/products(category=${selectedCategory}, page=${currentPage - 1})}">
                    <i class="fas fa-chevron-left"></i>
                </a>
            </li>
            <li class="page-item active">
                <span class="page-link" th:text="${currentPage}">1</span>
            </li>
            <li class="page-item">
                <a class="page-link" th:href="@{/products(category=${selectedCategory}, page=${currentPage + 1})}">
                    <i class="fas fa-chevron-right"></i>
                </a>
            </li>
        </ul>
    </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
