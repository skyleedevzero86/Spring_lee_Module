<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'상품 상세 - ' + ${product.item_id}">상품 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .product-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            margin-bottom: 1rem;
        }
        .related-product-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .related-product-card:hover {
            transform: translateY(-5px);
        }
        .rating-stars {
            color: #ffc107;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">
            <i class="fas fa-chart-line me-2"></i>Flink Event Analysis
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/dashboard">대시보드</a>
            <a class="nav-link" href="/products">상품</a>
            <a class="nav-link" href="/analytics">분석</a>
            <a class="nav-link" href="/admin">관리자</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="product-header" th:if="${product != null and !product.isEmpty()}">
        <div class="row align-items-center">
            <div class="col-md-8">
                <h1 th:text="${product.item_id}">상품 ID</h1>
                <p class="mb-0">
                    <span class="badge bg-light text-dark me-2" th:text="${product.category}">카테고리</span>
                    <i class="fas fa-eye me-1"></i>
                    <span th:text="${product.total_views}">0</span>회 조회
                </p>
            </div>
            <div class="col-md-4 text-end">
                <div class="rating-stars">
                    <i class="fas fa-star" th:if="${product.avg_rating != null and product.avg_rating >= 1}"></i>
                    <i class="fas fa-star" th:if="${product.avg_rating != null and product.avg_rating >= 2}"></i>
                    <i class="fas fa-star" th:if="${product.avg_rating != null and product.avg_rating >= 3}"></i>
                    <i class="fas fa-star" th:if="${product.avg_rating != null and product.avg_rating >= 4}"></i>
                    <i class="fas fa-star" th:if="${product.avg_rating != null and product.avg_rating >= 5}"></i>
                    <span th:if="${product.avg_rating != null}"
                          th:text="'(' + #numbers.formatDecimal(product.avg_rating, 1, 1) + ')'">(0.0)</span>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center py-5" th:if="${product == null or product.isEmpty()}">
        <i class="fas fa-exclamation-triangle fa-3x text-warning mb-3"></i>
        <h4 class="text-muted">상품을 찾을 수 없습니다</h4>
        <p class="text-muted">요청하신 상품이 존재하지 않습니다.</p>
        <a href="/products" class="btn btn-primary">
            <i class="fas fa-arrow-left me-2"></i>상품 목록으로 돌아가기
        </a>
    </div>

    <div class="row" th:if="${product != null and !product.isEmpty()}">
        <div class="col-md-3">
            <div class="stat-card">
                <h3 class="text-primary" th:text="${product.total_views}">0</h3>
                <p class="text-muted mb-0">총 조회수</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <h3 class="text-success" th:text="${product.purchase_count}">0</h3>
                <p class="text-muted mb-0">구매 횟수</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <h3 class="text-warning" th:text="${product.avg_rating != null ? #numbers.formatDecimal(product.avg_rating, 1, 1) : 'N/A'}">0.0</h3>
                <p class="text-muted mb-0">평균 평점</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <h3 class="text-info" th:text="${product.category}">카테고리</h3>
                <p class="text-muted mb-0">분류</p>
            </div>
        </div>
    </div>

    <div class="mt-5" th:if="${relatedProducts != null and !relatedProducts.isEmpty()}">
        <h3 class="mb-4">
            <i class="fas fa-link me-2"></i>관련 상품
        </h3>
        <div class="row">
            <div class="col-md-4 col-lg-3" th:each="related : ${relatedProducts}">
                <div class="card related-product-card h-100">
                    <div class="card-body">
                        <h6 class="card-title" th:text="${related.item_id}">관련 상품</h6>
                        <p class="card-text">
                            <span class="badge bg-secondary" th:text="${related.category}">카테고리</span>
                        </p>
                        <div class="text-center">
                            <small class="text-muted">관련도 점수</small>
                            <div class="fw-bold text-primary" th:text="${related.relevance_score}">0</div>
                        </div>
                        <div class="mt-3">
                            <a th:href="@{/products/{id}(id=${related.item_id})}"
                               class="btn btn-outline-primary btn-sm w-100">
                                <i class="fas fa-eye me-2"></i>보기
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center mt-4">
        <a href="/products" class="btn btn-secondary">
            <i class="fas fa-arrow-left me-2"></i>상품 목록으로 돌아가기
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
