<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 대시보드 - Flink Event Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .admin-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .metric-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 1.5rem;
            text-align: center;
            margin-bottom: 1rem;
        }
        .metric-card h3 {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        .table-responsive {
            border-radius: 15px;
            overflow: hidden;
        }
        .chart-container {
            position: relative;
            height: 300px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">
            <i class="fas fa-chart-line me-2"></i>Flink Event Analysis
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/dashboard">대시보드</a>
            <a class="nav-link" href="/products">상품</a>
            <a class="nav-link" href="/analytics">분석</a>
            <a class="nav-link active" href="/admin">관리자</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1 class="mb-4">
        <i class="fas fa-cogs me-2"></i>관리자 대시보드
    </h1>

    <div class="row" th:if="${realtimeStats != null}">
        <div class="col-md-4">
            <div class="metric-card">
                <h3 th:text="${realtimeStats.activeUsers}">0</h3>
                <p class="mb-0"><i class="fas fa-users me-2"></i>활성 사용자</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="metric-card">
                <h3 th:text="${realtimeStats.eventsPerSecond}">0</h3>
                <p class="mb-0"><i class="fas fa-mouse-pointer me-2"></i>초당 이벤트</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="metric-card">
                <h3 th:text="${realtimeStats.totalEvents}">0</h3>
                <p class="mb-0"><i class="fas fa-chart-bar me-2"></i>총 이벤트</p>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="admin-card">
                <h4 class="mb-4">
                    <i class="fas fa-trophy me-2"></i>인기 상품 TOP 10
                </h4>
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead class="table-dark">
                        <tr>
                            <th>순위</th>
                            <th>상품 ID</th>
                            <th>카테고리</th>
                            <th>인기도 점수</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item, iterStat : ${topItems}">
                            <td>
                                <span class="badge bg-primary" th:text="${iterStat.index + 1}">1</span>
                            </td>
                            <td th:text="${item.item_id}">상품 ID</td>
                            <td>
                                <span class="badge bg-secondary" th:text="${item.category}">카테고리</span>
                            </td>
                            <td>
                                        <span class="fw-bold text-success"
                                              th:text="${#numbers.formatDecimal(item.popularity_score, 1, 1)}">0.0</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="admin-card">
                <h4 class="mb-4">
                    <i class="fas fa-chart-pie me-2"></i>인기 카테고리
                </h4>
                <div class="chart-container">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div class="admin-card">
        <h4 class="mb-4">
            <i class="fas fa-server me-2"></i>시스템 상태
        </h4>
        <div class="row">
            <div class="col-md-3">
                <div class="text-center">
                    <div class="mb-2">
                        <i class="fas fa-database fa-2x text-success"></i>
                    </div>
                    <h5>데이터베이스</h5>
                    <span class="badge bg-success">정상</span>
                </div>
            </div>
            <div class="col-md-3">
                <div class="text-center">
                    <div class="mb-2">
                        <i class="fas fa-stream fa-2x text-success"></i>
                    </div>
                    <h5>Flink 스트림</h5>
                    <span class="badge bg-success">실행중</span>
                </div>
            </div>
            <div class="col-md-3">
                <div class="text-center">
                    <div class="mb-2">
                        <i class="fas fa-comments fa-2x text-success"></i>
                    </div>
                    <h5>Kafka</h5>
                    <span class="badge bg-success">연결됨</span>
                </div>
            </div>
            <div class="col-md-3">
                <div class="text-center">
                    <div class="mb-2">
                        <i class="fas fa-globe fa-2x text-success"></i>
                    </div>
                    <h5>WebSocket</h5>
                    <span class="badge bg-success">활성</span>
                </div>
            </div>
        </div>
    </div>

    <div class="admin-card">
        <h4 class="mb-4">
            <i class="fas fa-bolt me-2"></i>빠른 작업
        </h4>
        <div class="row">
            <div class="col-md-3">
                <a href="/products" class="btn btn-outline-primary w-100 mb-2">
                    <i class="fas fa-box me-2"></i>상품 관리
                </a>
            </div>
            <div class="col-md-3">
                <a href="/analytics" class="btn btn-outline-info w-100 mb-2">
                    <i class="fas fa-chart-line me-2"></i>분석 보기
                </a>
            </div>
            <div class="col-md-3">
                <button class="btn btn-outline-warning w-100 mb-2" onclick="refreshData()">
                    <i class="fas fa-sync me-2"></i>데이터 새로고침
                </button>
            </div>
            <div class="col-md-3">
                <button class="btn btn-outline-danger w-100 mb-2" onclick="exportData()">
                    <i class="fas fa-download me-2"></i>데이터 내보내기
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>

    const ctx = document.getElementById('categoryChart').getContext('2d');
    const categoryChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: [],
            datasets: [{
                data: [],
                backgroundColor: [
                    '#FF6384',
                    '#36A2EB',
                    '#FFCE56',
                    '#4BC0C0',
                    '#9966FF'
                ]
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false
        }
    });

    function updateCategoryChart(categories) {
        const labels = Object.keys(categories);
        const data = Object.values(categories);

        categoryChart.data.labels = labels;
        categoryChart.data.datasets[0].data = data;
        categoryChart.update();
    }

    document.addEventListener('DOMContentLoaded', function() {
        const topCategories = /*[[${topCategories}]]*/ {};
        updateCategoryChart(topCategories);
    });

    function refreshData() {
        location.reload();
    }

    function exportData() {
        alert('데이터 내보내기 기능은 준비 중입니다.');
    }
</script>
</body>
</html>
