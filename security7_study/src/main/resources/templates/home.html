<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>홈</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f5f5f5;
      }
      .navbar {
        background: #001f3f;
        color: white;
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .navbar h1 {
        font-size: 24px;
      }
      .navbar a {
        color: white;
        text-decoration: none;
        margin-left: 20px;
      }
      .container {
        max-width: 1200px;
        margin: 30px auto;
        padding: 0 20px;
      }
      .card {
        background: white;
        padding: 30px;
        border-radius: 10px;
        margin-bottom: 20px;
      }
      .card h2 {
        color: #333;
        margin-bottom: 20px;
      }
      .info {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
      }
      .info-item {
        flex: 1;
        min-width: 200px;
      }
      .info-item strong {
        color: #001f3f;
      }
      .btn {
        display: inline-block;
        padding: 10px 20px;
        background: #001f3f;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        margin-right: 10px;
        margin-top: 10px;
      }
      .btn:hover {
        opacity: 0.9;
      }
      .authorities {
        list-style: none;
        padding: 0;
      }
      .authorities li {
        display: inline-block;
        background: #001f3f;
        color: white;
        padding: 5px 15px;
        border-radius: 20px;
        margin: 5px 5px 5px 0;
      }
    </style>
  </head>
  <body>
    <div class="navbar">
      <h1>Security 7 Study</h1>
      <div>
        <span th:text="'환영합니다, ' + ${username} + '님'"></span>
        <a th:href="@{/logout}">로그아웃</a>
      </div>
    </div>

    <div class="container">
      <div class="card">
        <h2>사용자 정보</h2>
        <div class="info">
          <div class="info-item">
            <strong>사용자명:</strong> <span th:text="${username}"></span>
          </div>
          <div class="info-item">
            <strong>권한:</strong>
            <ul class="authorities" th:if="${authorities}">
              <li
                th:each="auth : ${authorities}"
                th:text="${auth.authority}"
              ></li>
            </ul>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>메뉴</h2>
        <a th:href="@{/users/profile}" class="btn">내 정보</a>
        <a th:href="@{/user}" class="btn">사용자 페이지</a>
        <a th:href="@{/admin}" class="btn">관리자 페이지</a>
        <a th:if="${hasAdminRole}" th:href="@{/users/list}" class="btn"
          >회원 관리</a
        >
      </div>
    </div>
  </body>
</html>
