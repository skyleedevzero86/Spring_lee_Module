<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>관리자 페이지</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f5f5f5;
      }
      .navbar {
        background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        color: white;
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .navbar a {
        color: white;
        text-decoration: none;
        margin-left: 20px;
      }
      .container {
        max-width: 1200px;
        margin: 30px auto;
        padding: 0 20px;
      }
      .card {
        background: white;
        padding: 30px;
        border-radius: 10px;
        text-align: center;
      }
      .card h1 {
        color: #e74c3c;
        margin-bottom: 20px;
      }
      .success {
        background: #ffe6e6;
        color: #e74c3c;
        padding: 20px;
        border-radius: 5px;
        margin: 20px 0;
      }
      .btn {
        display: inline-block;
        padding: 10px 20px;
        background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        color: white;
        text-decoration: none;
        border-radius: 5px;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="navbar">
      <h1>Security 7 Study - 관리자</h1>
      <div>
        <a th:href="@{/home}">홈</a>
        <a th:href="@{/logout}">로그아웃</a>
      </div>
    </div>

    <div class="container">
      <div class="card">
        <h1>관리자 페이지</h1>
        <div class="success">
          <p>환영합니다, <strong th:text="${username}"></strong>님!</p>
          <p>관리자 페이지에 성공적으로 접근하셨습니다.</p>
          <p>권한: <strong th:text="${role}"></strong></p>
        </div>
        <a th:href="@{/home}" class="btn">홈으로 돌아가기</a>
        <a th:href="@{/users/list}" class="btn">회원 관리</a>
      </div>
    </div>
  </body>
</html>
