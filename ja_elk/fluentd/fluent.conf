<source>
  @type forward
  port 24224
  bind "0.0.0.0"
</source>

<match spring.**>
  @type elasticsearch
  host "elasticsearch"
  port 9200
  index_name "spring-logs"
  default_elasticsearch_version 7
  validate_client_version false
  suppress_type_name true
  type_name "_doc"
  template_overwrite true

  <buffer>
    @type "file"
    path "/fluentd/log/spring.*.buffer"
    flush_mode interval
    retry_type exponential_backoff
    flush_thread_count 2
    flush_interval 5s
    retry_forever
    retry_max_interval 30
    chunk_limit_size 2M
    queue_limit_length 8
    overflow_action block
  </buffer>
</match>

<match **>
  @type stdout
</match>