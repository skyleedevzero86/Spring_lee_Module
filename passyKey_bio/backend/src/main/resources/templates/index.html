<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="안전한 패스키 인증 시스템">
    <title>PassyKey - 패스키 인증</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard-dynamic-subset.min.css" />
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <a href="#main-content" class="skip-link">본문으로 바로가기</a>

    <header class="header" role="banner">
        <div class="header__container">
            <div class="header__logo">
                <a href="/" aria-label="홈으로 이동">PassyKey</a>
            </div>
        </div>
    </header>

    <main id="main-content" role="main">
        <section class="auth-page">
            <div class="auth-container">
                <div class="auth-header">
                    <h1>PassyKey</h1>
                    <p>안전한 패스키 인증 시스템</p>
                </div>
                <div class="auth-section">
                    <h2>환영합니다</h2>
                    <p style="margin-bottom: 2rem; color: #666;">패스키로 더 안전하고 편리한 인증을 경험하세요</p>
                    <div class="button-group">
                        <a href="/register" class="btn btn--primary">회원가입</a>
                        <a href="/login" class="btn btn-secondary">로그인</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer" role="contentinfo">
        <div class="footer__bottom">
            <div class="container">
                <div class="footer__content">
                    <p>© 2025 PassyKey. All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
