syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.sleekydz86.searchai.proto";
option java_outer_classname = "SearchAiProto";

package searchai;

enum ChatMode {
  CHAT_MODE_UNSPECIFIED = 0;
  DIRECT = 1;
  KNOWLEDGE_BASE = 2;
  INTERNET_SEARCH = 3;
}

message ChatRequest {
  string user_id = 1;
  string message = 2;
  ChatMode mode = 3;
  string routing_mode = 4;
  string forced_tier = 5;
  string username = 6;
}

message ChatChunk {
  string content = 1;
  string event_type = 2;
  string request_id = 3;
  int64 sequence = 4;
  string finish_reason = 5;
}

service AiChatService {
  rpc StreamChat(ChatRequest) returns (stream ChatChunk);
}

message UploadRequest {
  string file_name = 1;
  bytes content = 2;
}

message UploadResponse {
  bool success = 1;
  string message = 2;
}

service KnowledgeService {
  rpc UploadDocument(UploadRequest) returns (UploadResponse);
}

message Empty {}

message UsageSummaryRequest {
  string username = 1;
}

message ModelCost {
  string tier = 1;
  string model = 2;
  int64 calls = 3;
  int64 total_tokens = 4;
  double estimated_cost = 5;
  double avg_latency_ms = 6;
  double success_rate = 7;
  int64 success_count = 8;
  int64 failure_count = 9;
  double p95_latency_ms = 10;
  double avg_prompt_tokens = 11;
  double avg_completion_tokens = 12;
  int64 fallback_count = 13;
  double cache_hit_ratio = 14;
}

message UsageSummaryResponse {
  int64 today_tokens = 1;
  int64 month_tokens = 2;
  double today_cost = 3;
  double month_cost = 4;
  int64 daily_limit = 5;
  int64 monthly_limit = 6;
  int64 per_request_limit = 7;
  double soft_ratio = 8;
  repeated ModelCost models = 9;
  string budget_state = 10;
}

message UsageAlert {
  string code = 1;
  string message = 2;
  string severity = 3;
  string username = 4;
  int64 created_at_epoch_ms = 5;
}

message AlertsResponse {
  repeated UsageAlert alerts = 1;
}

message NamedCount {
  string name = 1;
  int64 count = 2;
  double cost = 3;
}

message TimelineBucket {
  string bucket = 1;
  int64 calls = 2;
  int64 tokens = 3;
  double cost = 4;
  int64 cache_hits = 5;
  double avg_latency_ms = 6;
}

message DetailedStatsRequest {
  string from_iso = 1;
  string to_iso = 2;
  string granularity = 3;
  string username = 4;
}

message DetailedStatsResponse {
  string from_iso = 1;
  string to_iso = 2;
  string granularity = 3;
  int64 total_calls = 4;
  int64 total_tokens = 5;
  double total_cost = 6;
  int64 cache_hits = 7;
  double cache_hit_ratio = 8;
  double avg_latency_ms = 9;
  double success_rate = 10;
  repeated NamedCount by_tier = 11;
  repeated NamedCount by_request_type = 12;
  repeated NamedCount by_day_of_week = 13;
  repeated NamedCount by_hour = 14;
  repeated NamedCount by_username = 15;
  repeated TimelineBucket timeline = 16;
  repeated ModelCost models = 17;
  repeated NamedCount by_routing_type = 18;
}

message AbTestRequest {
  string prompt = 1;
  repeated string tiers = 2;
}

message AbTestVariant {
  string tier = 1;
  string model = 2;
  string response = 3;
  int64 latency_ms = 4;
  int64 prompt_tokens = 5;
  int64 completion_tokens = 6;
  int64 total_tokens = 7;
  double estimated_cost = 8;
  bool success = 9;
  string error = 10;
}

message AbTestResponse {
  string prompt = 1;
  repeated AbTestVariant variants = 2;
}

message RuntimePolicy {
  int64 per_request_limit = 1;
  int64 daily_limit = 2;
  int64 monthly_limit = 3;
  double soft_ratio = 4;
  double warn_ratio = 5;
  double anomaly_multiplier = 6;
  int32 rate_limit_per_minute = 7;
  string router_mode = 8;
  double confidence_threshold = 9;
  string max_tier_cap = 10;
  bool cache_enabled = 11;
  int64 max_output_tokens = 12;
  int64 weekly_limit = 13;
  double daily_cost_limit = 14;
  double monthly_cost_limit = 15;
  string default_plan = 16;
}

service UsageService {
  rpc GetUsageSummary(UsageSummaryRequest) returns (UsageSummaryResponse);
  rpc GetAlerts(Empty) returns (AlertsResponse);
  rpc GetDetailedStats(DetailedStatsRequest) returns (DetailedStatsResponse);
  rpc GetRuntimePolicy(Empty) returns (RuntimePolicy);
  rpc UpdateRuntimePolicy(RuntimePolicy) returns (RuntimePolicy);
  rpc RunAbTest(AbTestRequest) returns (AbTestResponse);
}
