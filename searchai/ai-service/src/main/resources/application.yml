spring:
  application:
    name: searchai-ai-service
  main:
    web-application-type: servlet
  config:
    import:
      - optional:classpath:application-models.yml
      - optional:classpath:application-resilience.yml
      - optional:classpath:application-usage.yml
      - optional:classpath:application-notification.yml
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  datasource:
    url: jdbc:h2:file:./data/searchai-usage;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:9379}
      password: ${REDIS_PASSWORD:123456}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-6-astra}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    typesafe:
      api-key: ${TYPESAFE_API_KEY:}
    vectorstore:
      redis:
        initialize-schema: true
        index-name: lee-vectorstore
        prefix: "lee:"
  grpc:
    server:
      port: ${GRPC_PORT:9090}

server:
  port: ${AI_HTTP_PORT:9091}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: searchai-ai-service
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}

app:
  ai:
    mode: ${APP_AI_MODE:mock}
  vector:
    mode: ${APP_VECTOR_MODE:memory}
  router:
    mode: ${APP_ROUTER_MODE:heuristic}
    confidence-threshold: 0.8
  cache:
    enabled: true
    ttl-seconds: 600
    mode: ${APP_CACHE_MODE:memory}
  internet:
    websearch:
      url: ${SEARXNG_URL:http://localhost:6080/search}
      counts: 25
  proxy:
    enabled: false
    host: 127.0.0.1
    port: 10080
  mock-ai:
    mode: ${APP_MOCK_AI_MODE:NORMAL}
