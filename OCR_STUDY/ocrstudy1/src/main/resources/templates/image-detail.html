<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이미지 상세 - OCR Study 01</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
    <link th:href="@{/css/common.css}" rel="stylesheet" />
    <link th:href="@{/css/image-detail.css}" rel="stylesheet" />
</head>
<body>
<div class="container mt-5">
    <a href="/" class="btn btn-secondary mb-3">← 목록으로</a>

    <div class="card">
        <div class="card-header">
            <h2 th:text="${image.originalFilename}"></h2>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <h4>이미지 정보</h4>
                    <table class="table">
                        <tr>
                            <th>파일명</th>
                            <td th:text="${image.originalFilename}"></td>
                        </tr>
                        <tr>
                            <th>파일 크기</th>
                            <td
                                    th:text="${#numbers.formatDecimal(image.fileSize / 1024.0, 1, 2)} + ' KB'"
                            ></td>
                        </tr>
                        <tr>
                            <th>업로드 시간</th>
                            <td
                                    th:text="${#temporals.format(image.createdAt, 'yyyy-MM-dd HH:mm:ss')}"
                            ></td>
                        </tr>
                        <tr>
                            <th>얼굴 감지</th>
                            <td>
                    <span
                            th:if="${image.faceEncoding != null and !image.faceEncoding.isEmpty()}"
                            class="badge bg-success"
                    >감지됨</span
                    >
                                <span
                                        th:unless="${image.faceEncoding != null and !image.faceEncoding.isEmpty()}"
                                        class="badge bg-secondary"
                                >없음</span
                                >
                            </td>
                        </tr>
                        <tr>
                            <th>문서 타입</th>
                            <td>
                    <span
                            class="badge"
                            th:classappend="${image.documentType == T(com.sleekydz86.ocrstudy1.domain.model.DocumentType).RECEIPT ? 'bg-success' :
                                      (image.documentType == T(com.sleekydz86.ocrstudy1.domain.model.DocumentType).ID_CARD ? 'bg-primary' :
                                      (image.documentType == T(com.sleekydz86.ocrstudy1.domain.model.DocumentType).DRIVER_LICENSE ? 'bg-warning' : 'bg-secondary'))}"
                            th:text="${image.documentType != null ? image.documentType.description : '기타'}"
                    ></span>
                            </td>
                        </tr>
                        <tr>
                            <th>신분증 여부</th>
                            <td>
                    <span th:if="${image.isIdCard}" class="badge bg-primary"
                    >신분증</span
                    >
                                <span
                                        th:unless="${image.isIdCard}"
                                        class="badge bg-secondary"
                                >일반 이미지</span
                                >
                            </td>
                        </tr>
                    </table>
                </div>

                <div class="col-md-6">
                    <h4>OCR 추출 텍스트</h4>
                    <div
                            class="ocr-text"
                            th:text="${image.ocrText != null ? image.ocrText : 'OCR 텍스트 없음'}"
                    ></div>

                    <div
                            th:if="${image.isIdCard and image.extractedIdInfo != null}"
                            class="mt-3"
                    >
                        <h4>추출된 신분증 정보</h4>
                        <div class="ocr-text" th:text="${image.extractedIdInfo}"></div>
                    </div>
                </div>
            </div>

            <div th:if="${comparison}" class="mt-4">
                <h4>최근 이미지와의 비교</h4>
                <div class="alert alert-info">
                    <p>
                        <strong>비교 유형:</strong>
                        <span th:text="${comparison.comparisonType}"></span>
                    </p>
                    <p>
                        <strong>유사도:</strong>
                        <span
                                class="comparison-badge badge"
                                th:classappend="${comparison.similarityScore >= 0.7 ? 'bg-success' : (comparison.similarityScore >= 0.4 ? 'bg-warning' : 'bg-danger')}"
                                th:text="${#numbers.formatDecimal(comparison.similarityScore * 100, 1, 2)} + '%'"
                        >
                </span>
                    </p>
                    <p>
                        <strong>상세:</strong>
                        <span th:text="${comparison.details}"></span>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/image-detail.js}"></script>
</body>
</html>
