<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OCR Study 01 - 이미지 업로드</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
    <link th:href="@{/css/common.css}" rel="stylesheet" />
    <link th:href="@{/css/index.css}" rel="stylesheet" />
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">OCR Study 01</h1>

    <div
            th:if="${success}"
            class="alert alert-success alert-dismissible fade show"
            role="alert"
    >
        <span th:text="${success}"></span>
        <button
                type="button"
                class="btn-close"
                data-bs-dismiss="alert"
        ></button>
    </div>
    <div
            th:if="${error}"
            class="alert alert-danger alert-dismissible fade show"
            role="alert"
    >
        <span th:text="${error}"></span>
        <button
                type="button"
                class="btn-close"
                data-bs-dismiss="alert"
        ></button>
    </div>

    <div class="card mb-5">
        <div class="card-header">
            <h3>이미지 업로드</h3>
        </div>
        <div class="card-body">
            <form
                    th:action="@{/upload}"
                    method="post"
                    enctype="multipart/form-data"
            >
                <div class="upload-area">
                    <input
                            type="file"
                            name="file"
                            accept="image/*"
                            class="form-control"
                            required
                    />
                    <p class="mt-3 text-muted">
                        이미지 파일을 선택하세요 (최대 50MB)
                    </p>
                </div>
                <button type="submit" class="btn btn-primary mt-3">
                    업로드 및 처리
                </button>
            </form>
        </div>
    </div>

    <div th:if="${result}" class="card mb-5">
        <div class="card-header">
            <h3>처리 결과</h3>
        </div>
        <div class="card-body">
            <p>
                <strong>파일명:</strong>
                <span th:text="${result.filename()}"></span>
            </p>
            <p><strong>OCR 텍스트:</strong></p>
            <div class="ocr-text" th:text="${result.ocrText()}"></div>
            <p>
                <strong>얼굴 감지:</strong>
                <span th:text="${result.hasFace() ? '예' : '아니오'}"></span>
            </p>
            <p>
                <strong>신분증:</strong>
                <span th:text="${result.isIdCard() ? '예' : '아니오'}"></span>
            </p>
            <div th:if="${result.extractedInfo()}">
                <p><strong>추출된 정보:</strong></p>
                <div class="ocr-text" th:text="${result.extractedInfo()}"></div>
            </div>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <form method="get" action="/">
                <div class="row align-items-end">
                    <div class="col-md-4">
                        <label for="documentType" class="form-label"
                        >문서 타입 필터</label
                        >
                        <select
                                name="documentType"
                                id="documentType"
                                class="form-select"
                        >
                            <option value="">전체</option>
                            <option
                                    th:each="type : ${documentTypes}"
                                    th:value="${type.name()}"
                                    th:text="${type.description}"
                                    th:selected="${selectedDocumentType != null and selectedDocumentType == type}"
                            ></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary">필터 적용</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div
                class="card-header d-flex justify-content-between align-items-center"
        >
            <h3 class="mb-0">업로드된 이미지 목록</h3>
            <span
                    class="badge bg-info"
                    th:text="'총 ' + ${totalItems} + '건'"
            ></span>
        </div>
        <div class="card-body">
            <div th:if="${images.isEmpty()}" class="text-center text-muted">
                <p>업로드된 이미지가 없습니다.</p>
            </div>
            <div th:each="image : ${images}" class="card image-card">
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-8">
                            <h5
                                    class="card-title"
                                    th:text="${image.originalFilename}"
                            ></h5>
                            <p class="card-text">
                    <span
                            class="badge"
                            th:classappend="${image.documentType == T(com.sleekydz86.ocrstudy1.domain.model.DocumentType).RECEIPT ? 'bg-success' :
                                      (image.documentType == T(com.sleekydz86.ocrstudy1.domain.model.DocumentType).ID_CARD ? 'bg-primary' :
                                      (image.documentType == T(com.sleekydz86.ocrstudy1.domain.model.DocumentType).DRIVER_LICENSE ? 'bg-warning' : 'bg-secondary'))}"
                            th:text="${image.documentType != null ? image.documentType.description : '기타'}"
                    ></span>
                                <small
                                        class="text-muted ms-2"
                                        th:text="${#temporals.format(image.createdAt, 'yyyy-MM-dd HH:mm:ss')}"
                                ></small>
                            </p>
                            <p
                                    class="card-text"
                                    th:if="${image.ocrText != null and !image.ocrText.isEmpty()}"
                            >
                                <small class="text-muted">
                      <span
                              th:text="${#strings.abbreviate(image.ocrText, 100)}"
                      ></span>
                                </small>
                            </p>
                        </div>
                        <div class="col-md-4 text-end">
                            <a
                                    th:href="@{/images/{id}(id=${image.id})}"
                                    class="btn btn-sm btn-primary"
                            >상세 보기</a
                            >
                        </div>
                    </div>
                </div>
            </div>

            <nav th:if="${totalPages > 1}" aria-label="Page navigation">
                <ul class="pagination justify-content-center">
                    <li
                            class="page-item"
                            th:classappend="${currentPage == 0} ? 'disabled'"
                    >
                        <a
                                class="page-link"
                                th:href="@{/(page=${currentPage - 1}, size=${pageSize}, documentType=${selectedDocumentType != null ? selectedDocumentType.name() : ''})}"
                        >이전</a
                        >
                    </li>
                    <li
                            th:each="pageNum : ${#numbers.sequence(0, totalPages - 1)}"
                            class="page-item"
                            th:classappend="${pageNum == currentPage} ? 'active'"
                    >
                        <a
                                class="page-link"
                                th:href="@{/(page=${pageNum}, size=${pageSize}, documentType=${selectedDocumentType != null ? selectedDocumentType.name() : ''})}"
                                th:text="${pageNum + 1}"
                        ></a>
                    </li>
                    <li
                            class="page-item"
                            th:classappend="${currentPage >= totalPages - 1} ? 'disabled'"
                    >
                        <a
                                class="page-link"
                                th:href="@{/(page=${currentPage + 1}, size=${pageSize}, documentType=${selectedDocumentType != null ? selectedDocumentType.name() : ''})}"
                        >다음</a
                        >
                    </li>
                </ul>
            </nav>

            <div class="mt-3 text-center">
                <small class="text-muted"
                >페이지 <span th:text="${currentPage + 1}"></span> /
                    <span th:text="${totalPages}"></span
                    ></small>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/index.js}"></script>
</body>
</html>
